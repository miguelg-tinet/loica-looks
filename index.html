<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas austral · Fondos Tinet y Loica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,550;9..40,650&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{background:#f5f5ed;color:#19362f}
body{margin:0;font:16px/1.5 'DM Sans',system-ui,sans-serif}
main,body>header{max-width:1480px;margin:auto;padding-inline:clamp(18px,5vw,88px)}
body>header{padding-block:clamp(34px,6vw,84px) 28px;display:flex;align-items:baseline;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1,h2,p{margin:0}
h1,h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;line-height:1.02;letter-spacing:-.045em}
h1{font-size:clamp(58px,7vw,108px)}
body>header p{font-size:clamp(14px,1.5vw,21px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* Filtros */
.filtros{border-block:1px solid currentColor;padding-block:14px;display:grid;gap:8px}
.faceta{display:grid;grid-template-columns:104px 1fr;align-items:baseline;gap:12px}
.faceta h2{font:650 .76rem/1.4 'DM Sans',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid currentColor;border-radius:99px;padding:4px 12px;font-size:.86rem;line-height:1.4;white-space:nowrap}
.chip small{font-size:.74rem;opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
.chip:hover{background:#19362f14}
.chip[aria-pressed=true]{background:#19362f;color:#faf8ed}
.chip:disabled{opacity:.32;cursor:default;background:none}
.estado{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-block:18px 4px;min-height:58px}
.estado strong{font-weight:650}
.estado p{max-width:70ch;font-size:.95rem}
.enlace{text-decoration:underline;text-underline-offset:5px;font-weight:650}
.enlace:hover{opacity:.8}

/* Tarjetas */
.art{width:100%;height:auto;display:block;background:#19362f1a}
.brand{font-size:.86rem}
.note h2{font-size:clamp(32px,3vw,54px);margin:7px 0 15px}
.note p{max-width:54ch;line-height:1.6}
.prints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.6vw,45px);margin:18px 0 60px}
.print .note{padding-block:18px}
.print h2{font-size:clamp(30px,2.6vw,43px)}
.tags{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:14px;font-size:.84rem}
.tags button{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;opacity:.8}
.tags button:hover{opacity:1}
details{margin-top:16px}
summary{cursor:pointer;font-weight:650;width:fit-content;text-decoration:underline;text-underline-offset:5px;padding:5px 0}
summary::marker{font-size:.8em}
.files{padding-top:10px}
.files a{color:inherit;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:9px 2px;text-decoration:none;border-bottom:1px solid currentColor;font-size:.84rem}
.files b{font-weight:550;font-variant-numeric:tabular-nums}
.files i{font-style:normal}
.files a:hover,summary:hover{opacity:.8}
a:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.vacio{padding-block:40px 120px;font-size:1.1rem}

@media(max-width:980px){
  .prints{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  body>header{display:block}
  body>header p{margin-top:8px}
  .faceta{grid-template-columns:1fr;gap:4px}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-18px;padding:3px 18px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .prints{display:block}
  .print{margin-bottom:24px}
}
</style>
</head>
<body>
<header>
  <h1>Atlas austral</h1>
  <p>Galería de fondos de Tinet y Loica</p>
</header>
<main>
  <nav class="filtros" id="filtros" aria-label="Filtrar fondos"></nav>
  <div class="estado" id="estado" aria-live="polite"></div>
  <div id="galeria">
    <noscript><p class="vacio">La galería necesita JavaScript para mostrarse. Los archivos están en las carpetas Videollamadas y Escritorio del repositorio.</p></noscript>
  </div>
</main>

<script src="fondos.js"></script>
<script>
(function () {
  var FONDOS = window.FONDOS || [];
  var ETIQUETAS = window.ETIQUETAS || {};

  // Facetas de filtro, en el orden en que se muestran. `orden: "abc"` ordena alfabéticamente;
  // sin él, las etiquetas siguen el orden de aparición en fondos.js.
  var FACETAS = [
    { id: "marca", nombre: "Marca", valores: function (f) { return [f.marca]; } },
    { id: "tema", nombre: "Tema", orden: "abc", valores: function (f) { return f.temas || []; } },
    { id: "tecnica", nombre: "Técnica", orden: "abc", valores: function (f) { return [f.tecnica]; } },
    { id: "tono", nombre: "Tono", valores: function (f) { return [f.tono]; } },
    { id: "coleccion", nombre: "Colección", valores: function (f) { return [f.coleccion]; } }
  ];
  var DESCARGAS = [
    { carpeta: "Videollamadas/", rotulo: "Videollamada con logo", medida: "1920 × 1080", sufijo: "1920x1080", campo: "videollamada" },
    { carpeta: "Escritorio/QHD/", rotulo: "Escritorio", medida: "2560 × 1440", sufijo: "2560x1440" },
    { carpeta: "Escritorio/", rotulo: "Escritorio", medida: "3840 × 2160", sufijo: "3840x2160" }
  ];

  var filtros = {}; // { idFaceta: etiqueta }
  var $filtros = document.getElementById("filtros");
  var $estado = document.getElementById("estado");
  var $galeria = document.getElementById("galeria");

  function slug(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function el(tag, attrs, hijos) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "on") for (var ev in attrs.on) n.addEventListener(ev, attrs.on[ev]);
      else n.setAttribute(k, attrs[k]);
    }
    (hijos || []).forEach(function (h) { if (h) n.appendChild(h); });
    return n;
  }
  function valores(faceta, fondo) {
    return faceta.valores(fondo).filter(Boolean);
  }
  // Fondos que cumplen todos los filtros activos, opcionalmente ignorando una faceta.
  function coinciden(salvo) {
    return FONDOS.filter(function (f) {
      return FACETAS.every(function (fa) {
        return fa.id === salvo || !filtros[fa.id] || valores(fa, f).indexOf(filtros[fa.id]) !== -1;
      });
    });
  }
  function etiquetasDe(faceta) {
    var vistas = [];
    FONDOS.forEach(function (f) {
      valores(faceta, f).forEach(function (v) { if (vistas.indexOf(v) === -1) vistas.push(v); });
    });
    if (faceta.orden === "abc") vistas.sort(function (a, b) { return a.localeCompare(b, "es"); });
    return vistas;
  }

  function alternar(idFaceta, etiqueta) {
    if (filtros[idFaceta] === etiqueta) delete filtros[idFaceta];
    else filtros[idFaceta] = etiqueta;
    guardarHash();
    pintar();
  }
  function soloEste(idFaceta, etiqueta) {
    filtros = {};
    filtros[idFaceta] = etiqueta;
    guardarHash();
    pintar();
    $filtros.scrollIntoView({ block: "start" });
  }

  // Los filtros viajan en la URL (#tema=aves&marca=loica) para poder compartir una vista.
  function guardarHash() {
    var partes = FACETAS.filter(function (fa) { return filtros[fa.id]; })
      .map(function (fa) { return fa.id + "=" + slug(filtros[fa.id]); });
    history.replaceState(null, "", partes.length ? "#" + partes.join("&") : location.pathname + location.search);
  }
  function leerHash() {
    filtros = {};
    location.hash.replace(/^#/, "").split("&").forEach(function (par) {
      var kv = par.split("=");
      var fa = FACETAS.filter(function (x) { return x.id === kv[0]; })[0];
      if (!fa || !kv[1]) return;
      var etiqueta = etiquetasDe(fa).filter(function (e) { return slug(e) === kv[1]; })[0];
      if (etiqueta) filtros[fa.id] = etiqueta;
    });
  }

  function pintarFiltros() {
    $filtros.replaceChildren.apply($filtros, FACETAS.map(function (fa) {
      var disponibles = coinciden(fa.id);
      var chips = etiquetasDe(fa).map(function (etq) {
        var n = disponibles.filter(function (f) { return valores(fa, f).indexOf(etq) !== -1; }).length;
        var activo = filtros[fa.id] === etq;
        var b = el("button", { type: "button", class: "chip", "aria-pressed": String(activo), on: { click: function () { alternar(fa.id, etq); } } },
          [document.createTextNode(etq), el("small", { text: String(n) })]);
        if (!n && !activo) b.disabled = true;
        return b;
      });
      return el("div", { class: "faceta", role: "group", "aria-label": fa.nombre }, [
        el("h2", { text: fa.nombre }),
        el("div", { class: "chips" }, chips)
      ]);
    }));
  }

  function tarjeta(f, primera) {
    var enlaces = DESCARGAS.map(function (d) {
      var rotulo = (d.campo && f[d.campo]) || d.rotulo;
      return el("a", {
        href: d.carpeta + f.archivo + ".jpg",
        download: f.archivo + "-" + d.sufijo + ".jpg",
        "aria-label": "Descargar " + f.titulo + ", " + rotulo + ", " + d.medida
      }, [el("span", { text: rotulo }), el("b", { text: d.medida }), el("i", { "aria-hidden": "true", text: "↓" })]);
    });
    var tags = [];
    FACETAS.forEach(function (fa) {
      if (fa.id === "marca" || fa.id === "tono") return;
      valores(fa, f).forEach(function (etq) {
        tags.push(el("button", { type: "button", title: "Ver fondos de " + etq, text: etq, on: { click: function () { soloEste(fa.id, etq); } } }));
      });
    });
    return el("article", { class: "print" }, [
      el("img", { class: "art", src: "Vistas/" + f.archivo + ".webp", width: "1440", height: "810", alt: f.alt || f.titulo, loading: primera ? "eager" : "lazy", decoding: "async" }),
      el("div", { class: "note" }, [
        el("span", { class: "brand", text: f.firma || f.marca }),
        el("h2", { text: f.titulo }),
        el("p", { text: f.texto || "" }),
        el("div", { class: "tags" }, tags),
        el("details", {}, [el("summary", { text: "Descargar fondo" }), el("div", { class: "files" }, enlaces)])
      ])
    ]);
  }

  function pintar() {
    pintarFiltros();
    var activos = FACETAS.filter(function (fa) { return filtros[fa.id]; }).map(function (fa) { return filtros[fa.id]; });
    var lista = coinciden();

    var estado = [el("strong", { text: lista.length + (lista.length === 1 ? " fondo" : " fondos") + (activos.length ? " · " + activos.join(" · ") : "") })];
    if (activos.length) {
      estado.push(el("button", { type: "button", class: "enlace", text: "Ver todos", on: { click: function () { filtros = {}; guardarHash(); pintar(); } } }));
      activos.forEach(function (a) { if (ETIQUETAS[a]) estado.push(el("p", { text: ETIQUETAS[a] })); });
    }
    $estado.replaceChildren.apply($estado, estado);

    $galeria.replaceChildren(lista.length
      ? el("div", { class: "prints" }, lista.map(function (f, i) { return tarjeta(f, i < 3); }))
      : el("p", { class: "vacio", text: "No hay fondos con esa combinación de filtros." }));
  }

  window.addEventListener("hashchange", function () { leerHash(); pintar(); });
  leerHash();
  pintar();
})();
</script>
</body>
</html>
